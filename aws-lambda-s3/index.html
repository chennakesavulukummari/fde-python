<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud Binary | S3 Upload</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="intro">
      <h1>Upload files to S3</h1>
      <p>Each upload goes straight to your bucket, triggers the destination Lambda, and sends an SNS alert.</p>
    </header>

    <div id="dropzone" class="dropzone" tabindex="0" role="button"
         aria-label="Choose files to upload. You can also drop files here.">
      <input type="file" id="fileInput" multiple hidden />
      <p class="dz-title">Drop files here</p>
      <p class="dz-sub">or click to browse. Images get a preview. Max 10 MB per file.</p>
    </div>

    <ul id="fileList" class="file-list" aria-live="polite"></ul>
    <p id="emptyMsg" class="empty">No files selected yet.</p>

    <div class="actions">
      <button id="uploadBtn" class="btn primary" disabled>Upload files</button>
      <button id="clearBtn" class="btn ghost" disabled>Clear list</button>
    </div>

    <p id="summary" class="summary" role="status"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
